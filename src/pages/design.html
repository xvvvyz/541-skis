<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Design studio · 541 Skis</title>
    <meta
      name="description"
      content="Describe any design and see it on a real 541 ski in 3D before it's built."
    />
    <meta name="theme-color" content="#f3f3f3" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="541 Skis" />
    <meta property="og:url" content="https://541.ski/design" />
    <meta property="og:title" content="Design your own 541 Skis" />
    <meta
      property="og:description"
      content="Describe any design and see it on a real 541 ski in 3D before it's built."
    />
    <meta property="og:image" content="https://541.ski/og/design.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A custom pair of 541 skis from the design studio"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800&display=block"
    />
    <link rel="stylesheet" href="/assets/app.css" />
    <script type="module" src="/assets/studio.js"></script>
  </head>
  <!-- The page never zooms, only the skis do (pagezoom.ts covers Safari),
       and its text only selects in fields. -->
  <body class="touch-pan-x touch-pan-y select-none lg:h-svh lg:overflow-hidden">
    <div class="lg:grid-cols-studio flex flex-col lg:grid lg:h-full">
      <div class="flex flex-col lg:min-h-0">
        <section
          class="bg-stage h-stage relative isolate min-h-110 overflow-hidden lg:h-auto lg:min-h-0 lg:flex-1"
          aria-label="Ski preview"
        >
          <!-- Their padding is the room the skis keep to, clear of the header
               and, on larger screens, the hint below. Zoomed in, they pass
               under the header and over the hint. -->
          <div
            data-viewer
            data-show="3d"
            hidden
            class="absolute inset-0 pt-16 pb-3 sm:pt-18 sm:pb-12"
            role="img"
            aria-label="Interactive 3D model of your skis"
          ></div>
          <div
            data-flat
            data-show="flat"
            tabindex="0"
            class="absolute inset-0 touch-none px-3 pt-16 pb-3 outline-none select-none sm:px-4 sm:pt-18 sm:pb-12"
            role="application"
            aria-label="Your design cut to shape. Tap a picture to pick it, then drag to move it, pull a corner to size it, or pinch with two fingers. Arrow keys move it, + and - size it, [ and ] turn it, Delete removes it."
          ></div>
          <!-- Placed over the picked picture by arrange.ts, in the stage's
               own white pills, ink when pressed. -->
          <div
            data-piece-tools
            hidden
            class="*:shadow-glow absolute z-20 flex items-center gap-2"
            role="toolbar"
            aria-label="Picture"
          >
            <button
              type="button"
              data-piece="both"
              aria-pressed="false"
              class="pill gap-2 bg-white not-aria-pressed:hover:bg-white"
            >
              <!-- Two skis side by side. -->
              <svg
                viewBox="0 0 20 20"
                class="size-4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="4" y="2.5" width="4.5" height="15" rx="2.25" />
                <rect x="11.5" y="2.5" width="4.5" height="15" rx="2.25" />
              </svg>
              Both skis
            </button>
            <button
              type="button"
              data-piece="back"
              class="pill gap-2 bg-white not-aria-pressed:hover:bg-white"
            >
              <!-- One square under another. -->
              <svg
                viewBox="0 0 20 20"
                class="size-4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="7" y="7" width="10" height="10" rx="1.5" />
                <path
                  d="M13 4.5V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h.5"
                />
              </svg>
              Send back
            </button>
            <button
              type="button"
              data-piece="remove"
              class="pill hover:text-crimson gap-2 bg-white not-aria-pressed:hover:bg-white"
            >
              <svg
                viewBox="0 0 20 20"
                class="size-4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3.5 5.5h13M8 5.5V3.5h4v2M5 5.5l.8 11h8.4l.8-11" />
              </svg>
              Remove
            </button>
          </div>
          <button
            type="button"
            data-fit
            hidden
            class="pill absolute right-3 bottom-3 z-10 bg-white not-aria-pressed:hover:bg-white sm:right-4 sm:bottom-4"
          >
            Zoom out
          </button>
          <div
            data-crop
            data-show="crop"
            hidden
            tabindex="0"
            class="absolute inset-0 cursor-grab touch-none px-3 pt-16 pb-3 outline-none select-none *:pointer-events-none sm:px-4 sm:pt-18 sm:pb-12"
            role="application"
            aria-label="Crop the pair from the art: drag or use the arrow keys to move it, scroll or press + and - to size it, press F to flip the art"
          ></div>
          <!-- Over the stage while an image is dragged onto the page. -->
          <div
            data-drop
            hidden
            class="bg-snow/85 border-crimson pointer-events-none absolute inset-3 z-40 grid place-items-center rounded-3xl border-2 border-dashed backdrop-blur sm:inset-4"
          >
            <p class="heading-3 trim">Drop to add it to your skis</p>
          </div>
          <button
            type="button"
            data-flip
            data-show="crop"
            hidden
            aria-pressed="false"
            class="pill absolute right-3 bottom-3 z-10 gap-2 bg-white not-aria-pressed:hover:bg-white sm:right-4 sm:bottom-4"
          >
            <svg
              viewBox="0 0 20 20"
              class="size-4"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M10 2v2.5m0 3v2.5m0 3v2.5m0 3V18" />
              <path d="M7 5 2 15h5zm6 0 5 10h-5z" />
            </svg>
            Flip
          </button>

          <!-- Shown from the start, until the studio has drawn the first pair. -->
          <div
            data-loading
            class="bg-snow/85 absolute inset-0 z-20 grid place-items-center pt-16 pb-3 backdrop-blur-xl sm:pt-18 sm:pb-12"
            role="status"
          >
            <div
              class="animate-appear flex flex-col items-center px-6 text-center"
            >
              <p class="heading-3 trim">Loading…</p>
              <div
                aria-hidden="true"
                class="bg-ink/10 mt-5 h-1 w-56 overflow-hidden rounded-full"
              >
                <div
                  class="bg-crimson motion-safe:animate-slide h-full w-2/5 rounded-full"
                ></div>
              </div>
            </div>
          </div>

          <div
            class="pointer-events-none absolute inset-x-0 top-0 z-30 flex items-center justify-between gap-2 p-3 sm:p-4"
          >
            <a
              href="/"
              class="pointer-events-auto flex shrink-0 items-center gap-3"
              aria-label="541 Skis home"
            >
              <svg viewBox="0 0 400 400" class="size-10" aria-hidden="true">
                <circle cx="200" cy="200" r="200" class="fill-crimson" />
                <path data-logo class="fill-white" />
              </svg>
              <span class="heading-3 trim hidden lg:block">Design Studio</span>
            </a>
            <!-- Inert until the studio has loaded, like the controls panel. -->
            <div inert class="flex items-center gap-3 sm:gap-4">
              <button
                type="button"
                data-bindings
                aria-pressed="false"
                class="pill pointer-events-auto gap-2 bg-white not-aria-pressed:hover:bg-white"
              >
                <!-- A boot clipped to a ski, heel and toe. -->
                <svg
                  viewBox="0 0 20 20"
                  class="size-4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M1 17.5h15.5A2.5 2.5 0 0 0 19 15" />
                  <path d="M6 15V3h4.5v6.5l4 2V15z" />
                  <path d="M3.5 17.5V13H6m8.5 0H17v4.5" />
                </svg>
                Bindings
              </button>
              <div
                class="segmented pointer-events-auto bg-white"
                role="group"
                aria-label="View"
              >
                <button
                  type="button"
                  data-mode="3d"
                  aria-pressed="false"
                  class="segment"
                >
                  3D
                </button>
                <button
                  type="button"
                  data-mode="flat"
                  aria-pressed="true"
                  class="segment"
                >
                  Flat
                </button>
                <button
                  type="button"
                  data-mode="crop"
                  aria-pressed="false"
                  disabled
                  class="segment"
                >
                  Crop
                </button>
              </div>
            </div>
          </div>

          <p
            class="eyebrow pointer-events-none absolute inset-x-0 bottom-4 hidden text-center sm:block"
          >
            Drag to <span data-drag>move pictures</span> ·
            <span class="pointer-coarse:hidden">scroll</span
            ><span class="hidden pointer-coarse:inline">pinch</span> to
            <span data-zoom>zoom</span>
          </p>

          <div
            data-busy
            hidden
            class="bg-snow/85 absolute inset-0 z-20 grid place-items-center pt-16 pb-3 backdrop-blur-xl sm:pt-18 sm:pb-12"
            aria-live="polite"
          >
            <div class="flex flex-col items-center px-6 text-center">
              <p data-busy-text class="heading-3 trim">Mixing the paint…</p>
              <div
                aria-hidden="true"
                class="bg-ink/10 mt-5 h-1 w-56 overflow-hidden rounded-full"
              >
                <div
                  data-progress
                  class="bg-crimson h-full origin-left scale-x-0 rounded-full transition-transform duration-300 ease-out"
                ></div>
              </div>
              <p class="text-muted text-label trim mt-5 font-mono">
                <span data-elapsed>0</span>s
              </p>
            </div>
          </div>
        </section>
      </div>

      <section
        data-controls
        inert
        class="group/controls border-line bg-paper lg:flex lg:flex-col lg:overflow-y-auto lg:border-l"
      >
        <div
          class="flex items-center justify-between gap-3 px-3 pt-3 sm:px-4 sm:pt-4"
        >
          <!-- None marked: the link says which, marked before it's drawn. -->
          <div class="segmented" role="group" aria-label="Length in cm">
            <!-- Picks the 193, then, once picked, opens its shapes. -->
            <button
              type="button"
              data-length="193"
              aria-pressed="false"
              aria-haspopup="menu"
              popovertarget="shapes"
              class="segment gap-1.5"
            >
              193
              <svg
                viewBox="0 0 20 20"
                class="size-3.5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m5.5 8 4.5 4.5L14.5 8" />
              </svg>
            </button>
            <button
              type="button"
              data-length="185"
              aria-pressed="false"
              class="segment gap-1.5"
            >
              185
            </button>
            <button
              type="button"
              data-length="175"
              aria-pressed="false"
              class="segment gap-1.5"
            >
              175
            </button>
          </div>
          <p
            data-specs
            class="bg-chip text-muted text-fine inline-flex h-10 min-w-0 items-center gap-3 overflow-hidden rounded-full px-4 font-mono whitespace-nowrap empty:invisible max-sm:px-3"
          ></p>
        </div>

        <!-- Placed under the 193 as it opens, and filled in by studio.ts. -->
        <div
          id="shapes"
          popover
          role="menu"
          aria-label="193 shape"
          class="bg-paper ring-line shadow-glow m-0 w-56 rounded-2xl p-1.5 ring-1"
        >
          <button
            type="button"
            role="menuitemradio"
            data-ski="193"
            aria-checked="false"
            class="group hover:bg-chip text-fine flex h-10 w-full cursor-pointer items-center gap-2 rounded-xl px-2.5 transition"
          >
            <svg
              viewBox="0 0 20 20"
              class="invisible size-4 group-aria-checked:visible"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m4.5 10.5 3.5 3.5 7.5-8" />
            </svg>
            Standard
            <span data-dims class="text-muted ml-auto font-mono"></span>
          </button>
          <button
            type="button"
            role="menuitemradio"
            data-ski="193-wide"
            aria-checked="false"
            class="group hover:bg-chip text-fine flex h-10 w-full cursor-pointer items-center gap-2 rounded-xl px-2.5 transition"
          >
            <svg
              viewBox="0 0 20 20"
              class="invisible size-4 group-aria-checked:visible"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m4.5 10.5 3.5 3.5 7.5-8" />
            </svg>
            Wide
            <span data-dims class="text-muted ml-auto font-mono"></span>
          </button>
        </div>

        <div
          class="flex flex-col gap-3 px-3 pt-3 pb-16 sm:gap-4 sm:px-4 sm:pt-4 lg:flex-1"
        >
          <h1 class="sr-only">Design your pair</h1>

          <!-- What changes the prompt sits above it, and the prompt, which grows
               with its text, comes below, so nothing moves under a tap.
               Changing the design on show goes last, so it appears below
               whatever picked the design. -->
          <div
            class="border-line -mx-3 border-b px-3 pb-3 sm:-mx-4 sm:px-4 sm:pb-4"
          >
            <div
              data-library-row
              role="group"
              aria-label="Designs"
              class="pill-row"
            >
              <span
                class="bg-chip h-36 w-16 shrink-0 animate-pulse rounded-2xl"
                aria-hidden="true"
              ></span>
              <span
                class="bg-chip h-36 w-16 shrink-0 animate-pulse rounded-2xl"
                aria-hidden="true"
              ></span>
              <span
                class="bg-chip h-36 w-16 shrink-0 animate-pulse rounded-2xl"
                aria-hidden="true"
              ></span>
              <span
                class="bg-chip h-36 w-16 shrink-0 animate-pulse rounded-2xl"
                aria-hidden="true"
              ></span>
              <span
                class="bg-chip h-36 w-16 shrink-0 animate-pulse rounded-2xl"
                aria-hidden="true"
              ></span>
              <span
                class="bg-chip h-36 w-16 shrink-0 animate-pulse rounded-2xl"
                aria-hidden="true"
              ></span>
              <span
                class="bg-chip h-36 w-16 shrink-0 animate-pulse rounded-2xl"
                aria-hidden="true"
              ></span>
              <span
                class="bg-chip h-36 w-16 shrink-0 animate-pulse rounded-2xl"
                aria-hidden="true"
              ></span>
            </div>
          </div>

          <!-- Your own images, on any design, the plain black pair too: quick
               and free, so before the prompt. -->
          <div
            class="border-line -mx-3 flex flex-col gap-3 border-b px-3 pb-3 sm:-mx-4 sm:gap-4 sm:px-4 sm:pb-4"
          >
            <label
              data-upload-label
              class="btn-ghost w-full px-5 has-disabled:pointer-events-none has-disabled:opacity-50 aria-busy:pointer-events-none aria-busy:opacity-60"
            >
              <input
                data-upload
                type="file"
                accept="image/*"
                multiple
                class="sr-only"
              />
              <svg
                viewBox="0 0 20 20"
                class="size-4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="2.5" y="3.5" width="15" height="13" rx="2" />
                <circle cx="7" cy="8" r="1.5" />
                <path d="m17.5 13-4-4-8 7.5" />
              </svg>
              <span data-upload-text>Add image</span>
            </label>
            <p
              data-upload-error
              class="text-crimson text-fine text-center text-balance empty:hidden"
              role="alert"
            ></p>
          </div>

          <div data-styles role="group" aria-label="Styles" class="pill-row">
            <span
              class="pill pointer-events-none w-24 animate-pulse"
              aria-hidden="true"
            ></span>
            <span
              class="pill pointer-events-none w-20 animate-pulse"
              aria-hidden="true"
            ></span>
            <span
              class="pill pointer-events-none w-18 animate-pulse"
              aria-hidden="true"
            ></span>
            <span
              class="pill pointer-events-none w-22 animate-pulse"
              aria-hidden="true"
            ></span>
            <span
              class="pill pointer-events-none w-20 animate-pulse"
              aria-hidden="true"
            ></span>
          </div>

          <form data-form class="flex flex-col gap-3 sm:gap-4" novalidate>
            <textarea
              id="prompt"
              name="prompt"
              rows="6"
              maxlength="600"
              class="field field-sizing-content min-h-26 resize-none leading-relaxed"
              aria-label="Describe your design"
              placeholder="Describe your design, like:&#10;Your dog on a powder day, in watercolor"
            ></textarea>

            <p
              data-error
              class="text-crimson text-fine text-center text-balance empty:hidden"
              role="alert"
            ></p>

            <div class="flex gap-3 sm:gap-4">
              <!-- A picture for the design to look like, shown to the AI and
                   never put on the skis. Once attached, it shows here, and
                   a tap takes it off. -->
              <input
                data-reference-input
                type="file"
                accept="image/*"
                class="sr-only"
                tabindex="-1"
                aria-hidden="true"
              />
              <button
                type="button"
                data-reference
                aria-label="Attach a picture for the design to look like"
                title="Attach a picture for the design to look like"
                class="btn-ghost group relative size-12 shrink-0 overflow-visible p-0 aria-busy:pointer-events-none aria-busy:opacity-60"
              >
                <svg
                  data-reference-icon
                  viewBox="0 0 20 20"
                  class="size-5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path
                    d="m16.5 9.5-6.4 6.4a4 4 0 0 1-5.7-5.7l6.7-6.7a2.6 2.6 0 0 1 3.7 3.7l-6.6 6.6a1.3 1.3 0 0 1-1.8-1.8l6-6"
                  />
                </svg>
                <img
                  data-reference-thumb
                  hidden
                  alt=""
                  class="size-full rounded-full object-cover"
                />
                <span
                  data-reference-remove
                  hidden
                  aria-hidden="true"
                  class="bg-ink absolute -top-1 -right-1 grid size-5 place-items-center rounded-full text-white ring-2 ring-white"
                >
                  <svg
                    viewBox="0 0 20 20"
                    class="size-3"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.4"
                    stroke-linecap="round"
                  >
                    <path d="m5.5 5.5 9 9m0-9-9 9" />
                  </svg>
                </span>
              </button>
              <button type="submit" class="btn-primary min-w-0 flex-1">
                <svg
                  viewBox="0 0 20 20"
                  class="size-4"
                  fill="currentColor"
                  aria-hidden="true"
                >
                  <path
                    d="M10 1.5l1.9 5 5.1 1.9-5.1 1.9-1.9 5.2-1.9-5.2L3 8.4l5.1-1.9z"
                  />
                  <path
                    d="M16 12.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"
                    opacity=".7"
                  />
                </svg>
                <span data-generate-label>Generate</span>
              </button>
            </div>
          </form>

          <div
            data-refine
            hidden
            class="border-line -mx-3 flex flex-col gap-3 border-t px-3 pt-3 sm:-mx-4 sm:gap-4 sm:px-4 sm:pt-4"
          >
            <div data-versions hidden>
              <div
                data-version-row
                aria-label="Versions"
                class="pill-row"
              ></div>
            </div>

            <form data-edit class="flex flex-col gap-3 sm:gap-4" novalidate>
              <p
                data-edit-error
                class="text-crimson text-fine text-center text-balance empty:hidden"
                role="alert"
              ></p>
              <div class="flex gap-3 sm:gap-4">
                <input
                  id="change"
                  name="change"
                  maxlength="600"
                  autocomplete="off"
                  enterkeyhint="go"
                  class="field h-12 min-w-0 flex-1"
                  aria-label="Change something"
                  placeholder="Change it: “add a moon”"
                />
                <button type="submit" class="btn-ghost px-5">Apply</button>
              </div>
            </form>
          </div>
        </div>

        <!-- Out of the way of the keyboard while typing on a phone. -->
        <footer
          class="bg-paper pb-safe-4 fade-above sticky bottom-0 z-20 grid grid-cols-2 gap-3 px-3 pt-3 max-lg:group-has-[:is(textarea,input):focus]/controls:invisible sm:gap-4 sm:px-4 sm:pt-4"
        >
          <button type="button" data-share class="btn-ghost max-lg:btn-sm px-4">
            Share
          </button>
          <button type="button" data-order class="btn-ink max-lg:btn-sm px-4">
            Buy
          </button>
        </footer>
      </section>
    </div>
  </body>
</html>
