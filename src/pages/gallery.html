<!doctype html>
<html lang="en" class="pointer-fine:overscroll-x-none">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Gallery · 541 Skis</title>
    <meta
      name="description"
      content="Designed by skiers in the 541 Skis studio. Start from any pair and make it your own."
    />
    <meta name="theme-color" content="#f5f3f0" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="541 Skis" />
    <meta property="og:url" content="https://541.ski/gallery" />
    <meta property="og:title" content="Gallery · 541 Skis" />
    <meta
      property="og:description"
      content="Designed by skiers in the 541 Skis studio. Start from any pair and make it your own."
    />
    <meta property="og:image" content="https://541.ski/og/design.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A custom pair of 541 skis from the design studio"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=block"
    />
    <!-- Headlines wait for their font rather than reflowing when it lands. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&display=block"
    />
    <link rel="stylesheet" href="/assets/app.css" />
    <script type="module" src="/assets/gallery.js"></script>
  </head>
  <!-- With a mouse or trackpad the page scrolls, --distance taller than the
       screen, sliding the row in a stage that stays put (see gallery.ts). -->
  <body
    class="relative isolate h-svh overflow-hidden pointer-fine:h-[calc(100svh+var(--distance,0px))] pointer-fine:overflow-visible"
  >
    <div
      aria-hidden="true"
      class="pointer-events-none fixed inset-x-0 top-0 -z-10 h-160 mask-b-from-30% mask-b-to-100%"
    >
      <img
        src="/images/hood-topo.svg"
        alt=""
        class="size-full object-cover opacity-12"
      />
    </div>
    <div class="sticky top-0 flex h-svh flex-col">
      <header>
        <div
          class="mx-auto flex max-w-7xl items-center justify-between px-3 pt-3 sm:px-6 sm:pt-6"
        >
          <a
            href="/"
            class="flex items-center gap-3"
            aria-label="541 Skis home"
          >
            <svg viewBox="0 0 400 400" class="size-10" aria-hidden="true">
              <circle cx="200" cy="200" r="200" class="fill-crimson" />
              <path data-logo class="fill-white" />
            </svg>
            <span class="heading-3 trim">Gallery</span>
          </a>
          <nav class="flex items-center">
            <a href="/design" class="btn-primary btn-sm">Design studio</a>
          </nav>
        </div>
      </header>

      <main class="relative flex min-h-0 flex-1 flex-col">
        <h1 class="sr-only">The gallery</h1>
        <!-- Filled in by gallery.ts. -->
        <div
          data-gallery
          aria-label="Designs"
          class="no-scrollbar fade-edges @container-size flex min-h-0 flex-1 overflow-x-auto overflow-y-hidden overscroll-x-contain [--edge:min(var(--inset),15%)] [--gutter:--spacing(8)] [--inset:calc(max(0px,(100cqw_-_var(--container-7xl))_/_2)_+_var(--gutter))] sm:[--gutter:--spacing(6)] pointer-fine:overflow-clip"
        >
          <!-- Padded inside the row, as Safari leaves a scroller's end
             padding out of how far it scrolls. -->
          <div
            data-row
            class="pointer-fine:slide-with-page flex w-max gap-8 px-(--inset) py-(--row-pad) [--row-pad:--spacing(10)] sm:gap-12 sm:[--row-pad:--spacing(14)]"
          >
            <p
              class="text-lead text-muted flex w-[min(16rem,60cqw)] flex-none items-end leading-relaxed text-pretty"
            >
              Designed by skiers in the studio. Start from any pair and make it
              your own.
            </p>
            <button
              type="button"
              data-more
              hidden
              class="btn-ghost flex-none self-center"
            >
              Show more
            </button>
          </div>
        </div>
        <p
          data-status
          class="text-muted text-body pointer-events-none absolute inset-0 grid place-items-center px-4 text-center empty:hidden"
        ></p>
      </main>
    </div>
  </body>
</html>
